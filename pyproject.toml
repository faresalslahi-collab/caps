[project]
name = "caps"
version = "1.0.0"
description = "CAPS — Capability-Based Access Control System for Frappe"
authors = [{name = "Arkan Lab", email = "dev@arkan.tech"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["frappe", "access-control", "permissions", "capabilities", "rbac", "security", "arabic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Frappe",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
]
dependencies = [
    "frappe>=16.0.0,<17.0.0",
    "pypika @ git+https://github.com/frappe/pypika@7ef6e40215d46cd531e8c4e58650b84c11abbd04",
    "gunicorn @ git+https://github.com/frappe/gunicorn@54b59ca884c79dcf04d4882658a32bbaf17e999f",
]

[project.urls]
Homepage = "https://github.com/faresalslahi-collab/caps"
Repository = "https://github.com/faresalslahi-collab/caps"
Documentation = "https://github.com/faresalslahi-collab/caps/tree/main/docs"
Issues = "https://github.com/faresalslahi-collab/caps/issues"
Changelog = "https://github.com/faresalslahi-collab/caps/blob/main/CHANGELOG.md"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
frappe_visual = ">=0.1.0"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
    "UP037",
    "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
